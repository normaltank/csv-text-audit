[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "csv-text-audit"
version = "0.1.0"
description = "Check whether selected CSV text fields survived conversion to XLSX"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["openpyxl>=3.1,<4"]

[project.scripts]
csv-text-audit = "csv_text_audit.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/csv_text_audit"]
